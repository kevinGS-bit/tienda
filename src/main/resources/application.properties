#Clase 1
spring.application.name=tienda
#Para definir el puerto donde "escuchara" el servidor
server.port = 8081

#Clase 2
#Para definir el formato de despliegue de fecha/hora del log de la consola 
looging.pattern.dateformat=hh:mm

#Para eliminar mensaje invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en produccion "true"
spring.thymeleaf.cache=false
